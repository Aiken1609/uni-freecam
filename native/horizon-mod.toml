id = "uni_freecam"
name = "Universal Freecam"
version = "0.1.0"
description = "Detach the camera and fly it anywhere while your player stays where it is."
authors = ["aiken"]
license = "MIT"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins.
api = "0.2"
side = "client"
# The shared manifest takes exactly this value; the mod adds no blocks, items or entities.
capabilities = ["registries"]

# tools/pack.py fills [native] for the Horizon build you choose (`pin`); never edit the commits by hand.
[native]
game = "26.3"
horizon = "@HORIZON@"
mixins = "@MIXINS@"
